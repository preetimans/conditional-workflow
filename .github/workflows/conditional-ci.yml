name: Conditional CI Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build Step
        run: echo "This is build job"
        
  test:
    runs-on: ubuntu-latest
    needs: build
    # Corrected condition using github.ref_name
    if: startsWith(github.ref_name, 'feature/') && success()
	
    steps:
    - name: Test Step
      run: echo "This is test job"

